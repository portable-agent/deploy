{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service.fullname" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "service.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  {{- if .Values.networkPolicy.ingressFrom }}
  ingress:
    - from: {{ toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    {{- if .Values.networkPolicy.allowDns }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- end }}
    {{- if .Values.networkPolicy.egressTo }}
    - to: {{ toYaml .Values.networkPolicy.egressTo | nindent 8 }}
    {{- end }}
{{- end }}
