services:
  channel-gateway:
    image: portable-agent/channel-gateway:local
    build:
      context: ${CHANNEL_GATEWAY_CONTEXT:-../../portable-agent-channel-gateway}
    pull_policy: build

  agent-runtime:
    image: portable-agent/agent-runtime:local
    build:
      context: ${AGENT_RUNTIME_CONTEXT:-../../portable-agent-agent-runtime}
    pull_policy: build

  action-service:
    image: portable-agent/action-service:local
    build:
      context: ${ACTION_SERVICE_CONTEXT:-../../portable-agent-action-service}
    pull_policy: build

  conversation-service:
    image: portable-agent/conversation-service:local
    build:
      context: ${CONVERSATION_SERVICE_CONTEXT:-../../portable-agent-conversation-service}
    pull_policy: build

  mcp-gateway:
    image: portable-agent/mcp-gateway:local
    build:
      context: ${MCP_GATEWAY_CONTEXT:-../../portable-agent-mcp-gateway}
    pull_policy: build

  calendar-mcp:
    image: portable-agent/calendar-mcp:local
    build:
      context: ${CALENDAR_MCP_CONTEXT:-../../portable-agent-calendar-mcp}
    pull_policy: build
