name: ${COMPOSE_PROJECT_NAME:-portable-agent}

services:
  postgres:
    profiles: [core]
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: platform
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      TEMPORAL_DB_USER: ${TEMPORAL_DB_USER:?set TEMPORAL_DB_USER}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
      ACTION_DB_USER: ${ACTION_DB_USER:?set ACTION_DB_USER}
      ACTION_DB_PASSWORD: ${ACTION_DB_PASSWORD:?set ACTION_DB_PASSWORD}
      CONVERSATION_DB_USER: ${CONVERSATION_DB_USER:?set CONVERSATION_DB_USER}
      CONVERSATION_DB_PASSWORD: ${CONVERSATION_DB_PASSWORD:?set CONVERSATION_DB_PASSWORD}
      TELEGRAM_DB_USER: ${TELEGRAM_DB_USER:?set TELEGRAM_DB_USER}
      TELEGRAM_DB_PASSWORD: ${TELEGRAM_DB_PASSWORD:?set TELEGRAM_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [platform]

  redpanda:
    profiles: [core]
    image: ${REDPANDA_IMAGE:?set REDPANDA_IMAGE}
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:${REDPANDA_PORT:-19092}
    ports:
      - "127.0.0.1:${REDPANDA_PORT:-19092}:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: [CMD-SHELL, "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [platform]

  keycloak:
    profiles: [core]
    image: ${KEYCLOAK_IMAGE:?set KEYCLOAK_IMAGE}
    command: [start-dev, --health-enabled=true, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      ACTION_SERVICE_CLIENT_SECRET: ${ACTION_SERVICE_CLIENT_SECRET:?set ACTION_SERVICE_CLIENT_SECRET}
      ACTION_SERVICE_TENANT_ID: ${ACTION_SERVICE_TENANT_ID:?set ACTION_SERVICE_TENANT_ID}
      TELEGRAM_ADAPTER_CLIENT_SECRET: ${TELEGRAM_ADAPTER_CLIENT_SECRET:?set TELEGRAM_ADAPTER_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keycloak/portable-agent-realm.json:/opt/keycloak/data/import/portable-agent-realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      test:
        [
          CMD-SHELL,
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [platform]

  postgres-bootstrap:
    profiles: [bootstrap]
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    entrypoint: [/bin/sh, /scripts/bootstrap.sh]
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER}
      POSTGRES_DB: platform
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      TEMPORAL_DB_USER: ${TEMPORAL_DB_USER:?set TEMPORAL_DB_USER}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
      ACTION_DB_USER: ${ACTION_DB_USER:?set ACTION_DB_USER}
      ACTION_DB_PASSWORD: ${ACTION_DB_PASSWORD:?set ACTION_DB_PASSWORD}
      CONVERSATION_DB_USER: ${CONVERSATION_DB_USER:?set CONVERSATION_DB_USER}
      CONVERSATION_DB_PASSWORD: ${CONVERSATION_DB_PASSWORD:?set CONVERSATION_DB_PASSWORD}
      TELEGRAM_DB_USER: ${TELEGRAM_DB_USER:?set TELEGRAM_DB_USER}
      TELEGRAM_DB_PASSWORD: ${TELEGRAM_DB_PASSWORD:?set TELEGRAM_DB_PASSWORD}
    volumes:
      - ./postgres:/scripts:ro
    depends_on:
      postgres:
        condition: service_started
    networks: [platform]

  temporal-setup:
    profiles: [core]
    image: ${TEMPORAL_ADMIN_IMAGE:?set TEMPORAL_ADMIN_IMAGE}
    restart: on-failure:5
    entrypoint: [/bin/sh, /scripts/setup-postgres.sh]
    environment:
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${TEMPORAL_DB_USER:?set TEMPORAL_DB_USER}
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
    volumes:
      - ./temporal/scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [platform]

  temporal:
    profiles: [core]
    image: ${TEMPORAL_SERVER_IMAGE:?set TEMPORAL_SERVER_IMAGE}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${TEMPORAL_DB_USER:?set TEMPORAL_DB_USER}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    depends_on:
      temporal-setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: [CMD, nc, -z, localhost, "7233"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [platform]

  temporal-namespace:
    profiles: [core]
    image: ${TEMPORAL_ADMIN_IMAGE:?set TEMPORAL_ADMIN_IMAGE}
    restart: on-failure:5
    entrypoint: [/bin/sh, /scripts/create-namespace.sh]
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADMIN_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:?set TEMPORAL_NAMESPACE}
      TEMPORAL_START_ATTEMPTS: ${TEMPORAL_START_ATTEMPTS:-30}
    volumes:
      - ./temporal/scripts:/scripts:ro
    depends_on:
      temporal:
        condition: service_healthy
    networks: [platform]

  temporal-ui:
    profiles: [core]
    image: ${TEMPORAL_UI_IMAGE:?set TEMPORAL_UI_IMAGE}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8080}:8080"
    networks: [platform]

  opa:
    profiles: [core]
    image: ${OPA_IMAGE:?set OPA_IMAGE}
    command: [run, --server, --addr=0.0.0.0:8181, /policies]
    volumes:
      - ./opa:/policies:ro
    ports:
      - "127.0.0.1:${OPA_PORT:-8181}:8181"
    healthcheck:
      test: [CMD, /opa, eval, "1 == 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  channel-gateway:
    profiles: [apps]
    image: ${CHANNEL_GATEWAY_IMAGE:?set CHANNEL_GATEWAY_IMAGE}
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      AGENT_URL: http://agent-runtime:8080
      AGENT_TIMEOUT_MS: 5000
      AGENT_AVAILABLE_CONNECTORS: '["fake-calendar"]'
      CONVERSATION_URL: http://conversation-service:8080
      CONVERSATION_TIMEOUT_MS: 10000
      ACTION_URL: http://action-service:8080
      ACTION_TIMEOUT_MS: 10000
      OIDC_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8081}/realms/portable-agent
      OIDC_JWKS_URL: http://keycloak:8080/realms/portable-agent/protocol/openid-connect/certs
      OIDC_AUDIENCE: channel-gateway
    depends_on:
      keycloak:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
      conversation-service:
        condition: service_healthy
      action-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CHANNEL_GATEWAY_PORT:-18084}:8080"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [platform]

  agent-runtime:
    profiles: [apps]
    image: ${AGENT_RUNTIME_IMAGE:?set AGENT_RUNTIME_IMAGE}
    environment:
      AGENT_OIDC_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8081}/realms/portable-agent
      AGENT_OIDC_JWKS_URL: http://keycloak:8080/realms/portable-agent/protocol/openid-connect/certs
      AGENT_OIDC_AUDIENCE: agent-runtime
      AGENT_ALLOWED_HOSTS: '["agent-runtime","localhost","127.0.0.1"]'
      AGENT_DOCS_ENABLED: "false"
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AGENT_RUNTIME_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live')",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [platform]

  calendar-mcp:
    profiles: [apps]
    image: ${CALENDAR_MCP_IMAGE:?set CALENDAR_MCP_IMAGE}
    environment:
      CALENDAR_TEST_API_ENABLED: "true"
      CALENDAR_TEST_API_KEY: ${CALENDAR_TEST_API_KEY:?set CALENDAR_TEST_API_KEY}
      CALENDAR_OIDC_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8081}/realms/portable-agent
      CALENDAR_OIDC_JWKS_URL: http://keycloak:8080/realms/portable-agent/protocol/openid-connect/certs
      CALENDAR_OIDC_AUDIENCE: calendar-mcp
      CALENDAR_MCP_RESOURCE_URL: http://calendar-mcp:8080/mcp
      CALENDAR_MCP_REQUIRED_SCOPES: '["calendar:write"]'
      CALENDAR_MCP_ALLOWED_HOSTS: '["calendar-mcp:8080","localhost:*","127.0.0.1:*"]'
      CALENDAR_MCP_ALLOWED_ORIGINS: '["http://calendar-mcp:8080","http://localhost:*","http://127.0.0.1:*"]'
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CALENDAR_MCP_PORT:-18082}:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [platform]

  mcp-gateway:
    profiles: [apps]
    image: ${MCP_GATEWAY_IMAGE:?set MCP_GATEWAY_IMAGE}
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      CALL_TIMEOUT_MS: 10000
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/portable-agent
      OIDC_JWKS_URL: http://keycloak:8080/realms/portable-agent/protocol/openid-connect/certs
      OIDC_AUDIENCE: mcp-gateway
      OIDC_REQUIRED_SCOPE: mcp:call
      MCP_CONNECTORS_JSON: '[{"name":"fake-calendar","url":"http://calendar-mcp:8080/mcp","tools":["create_event"]}]'
    depends_on:
      keycloak:
        condition: service_healthy
      calendar-mcp:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_GATEWAY_PORT:-18083}:8080"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [platform]

  action-service:
    profiles: [apps]
    image: ${ACTION_SERVICE_IMAGE:?set ACTION_SERVICE_IMAGE}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/actions
      DATABASE_USER: ${ACTION_DB_USER:?set ACTION_DB_USER}
      DATABASE_PASSWORD: ${ACTION_DB_PASSWORD:?set ACTION_DB_PASSWORD}
      OIDC_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8081}/realms/portable-agent
      OIDC_AUDIENCE: action-service
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/portable-agent/protocol/openid-connect/certs
      TEMPORAL_TARGET: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:?set TEMPORAL_NAMESPACE}
      TEMPORAL_TASK_QUEUE: action-service
      MCP_GATEWAY_ENABLED: "true"
      MCP_GATEWAY_URL: http://mcp-gateway:8080
      MCP_GATEWAY_TOKEN_URL: http://keycloak:8080/realms/portable-agent/protocol/openid-connect/token
      MCP_GATEWAY_CLIENT_ID: action-service
      MCP_GATEWAY_CLIENT_SECRET: ${ACTION_SERVICE_CLIENT_SECRET:?set ACTION_SERVICE_CLIENT_SECRET}
      MCP_GATEWAY_SCOPE: mcp:call calendar:write
      MCP_GATEWAY_TENANT_ID: ${ACTION_SERVICE_TENANT_ID:?set ACTION_SERVICE_TENANT_ID}
      MCP_GATEWAY_CONNECT_TIMEOUT: 3s
      MCP_GATEWAY_READ_TIMEOUT: 10s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      temporal:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ACTION_SERVICE_PORT:-18081}:8080"
    healthcheck:
      test:
        [
          CMD-SHELL,
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"HTTP/1.1 200 \" <&3'",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks: [platform]

  conversation-service:
    profiles: [apps]
    image: ${CONVERSATION_SERVICE_IMAGE:?set CONVERSATION_SERVICE_IMAGE}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/conversations
      DB_USER: ${CONVERSATION_DB_USER:?set CONVERSATION_DB_USER}
      DB_PASSWORD: ${CONVERSATION_DB_PASSWORD:?set CONVERSATION_DB_PASSWORD}
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/portable-agent
      OIDC_JWKS_URL: http://keycloak:8080/realms/portable-agent/protocol/openid-connect/certs
      OIDC_AUDIENCE: conversation-service
      AGENT_URL: http://agent-runtime:8080
      ACTION_URL: http://action-service:8080
      REMOTE_CONNECT_TIMEOUT: PT2S
      REMOTE_READ_TIMEOUT: PT10S
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
      action-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CONVERSATION_SERVICE_PORT:-18085}:8080"
    healthcheck:
      test:
        [
          CMD-SHELL,
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"HTTP/1.1 200 \" <&3'",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks: [platform]

  fake-telegram:
    profiles: [apps]
    image: ${WIREMOCK_IMAGE:?set WIREMOCK_IMAGE}
    command: [--disable-banner]
    volumes:
      - ./telegram:/home/wiremock:ro
    ports:
      - "127.0.0.1:${TELEGRAM_FAKE_PORT:-18087}:8080"
    networks: [platform]

  telegram-adapter:
    profiles: [apps]
    image: ${TELEGRAM_ADAPTER_IMAGE:?set TELEGRAM_ADAPTER_IMAGE}
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      TELEGRAM_API_URL: http://fake-telegram:8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: portable-agent
      KEYCLOAK_CLIENT_ID: telegram-adapter
      KEYCLOAK_CLIENT_SECRET: ${TELEGRAM_ADAPTER_CLIENT_SECRET:?set TELEGRAM_ADAPTER_CLIENT_SECRET}
      DATABASE_URL: postgres://${TELEGRAM_DB_USER:?set TELEGRAM_DB_USER}:${TELEGRAM_DB_PASSWORD:?set TELEGRAM_DB_PASSWORD}@postgres:5432/telegram_adapter
      CHANNEL_GATEWAY_URL: http://channel-gateway:8080
      CHANNEL_GATEWAY_TIMEOUT_MS: 10000
      LINK_POLL_MS: 1000
      DEFAULT_LOCALE: ru-RU
      DEFAULT_TIME_ZONE: Europe/Moscow
      TOKEN_KEY_BASE64: ${TELEGRAM_TOKEN_KEY_BASE64:?set TELEGRAM_TOKEN_KEY_BASE64}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      channel-gateway:
        condition: service_healthy
      fake-telegram:
        condition: service_started
    ports:
      - "127.0.0.1:${TELEGRAM_ADAPTER_PORT:-18086}:8080"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [platform]

  cloudflared:
    profiles: [telegram-real]
    image: ${CLOUDFLARED_IMAGE:?set CLOUDFLARED_IMAGE}
    command: [tunnel, --no-autoupdate, --url, http://telegram-adapter:8080]
    depends_on:
      telegram-adapter:
        condition: service_healthy
    networks: [platform]

  tempo:
    profiles: [observe]
    image: ${TEMPO_IMAGE:?set TEMPO_IMAGE}
    command: [-config.file=/etc/tempo/config.yaml]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    networks: [platform]

  loki-init:
    profiles: [observe]
    image: ${BUSYBOX_IMAGE:?set BUSYBOX_IMAGE}
    command: [sh, -c, "chown -R 10001:10001 /data"]
    volumes:
      - loki-data:/data
    networks: [platform]

  loki:
    profiles: [observe]
    image: ${LOKI_IMAGE:?set LOKI_IMAGE}
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/tmp/loki
    depends_on:
      loki-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    networks: [platform]

  otel-collector:
    profiles: [observe]
    image: ${OTEL_COLLECTOR_IMAGE:?set OTEL_COLLECTOR_IMAGE}
    command: [--config=/etc/otel/config.yaml]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on: [tempo, loki]
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    networks: [platform]

  prometheus:
    profiles: [observe]
    image: ${PROMETHEUS_IMAGE:?set PROMETHEUS_IMAGE}
    command: [--config.file=/etc/prometheus/prometheus.yaml, --storage.tsdb.path=/prometheus]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    depends_on: [otel-collector]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [platform]

  grafana:
    profiles: [observe]
    image: ${GRAFANA_IMAGE:?set GRAFANA_IMAGE}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, tempo, loki]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [platform]

networks:
  platform:
    driver: bridge

volumes:
  postgres-data:
  redpanda-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
