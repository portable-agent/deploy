name: Full application smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/app-smoke.yml"
      - ".env.example"
      - "compose/**"
      - "config/versions.env"
      - "Taskfile.yml"
      - "scripts/run-test-lab.ps1"
      - "scripts/check-compose.ps1"
      - "scripts/check-keycloak.ps1"
      - "scripts/local-settings.ps1"
      - "scripts/start-local.ps1"
      - "scripts/service-local.ps1"
      - "scripts/stop-local.ps1"

permissions:
  contents: read

jobs:
  apps:
    name: Agent to Calendar acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: pa-app-${{ github.run_id }}-${{ github.run_attempt }}
      CHANNEL_GATEWAY_CONTEXT: ${{ github.workspace }}/repos/channel-gateway
      AGENT_RUNTIME_CONTEXT: ${{ github.workspace }}/repos/agent-runtime
      ACTION_SERVICE_CONTEXT: ${{ github.workspace }}/repos/action-service
      CONVERSATION_SERVICE_CONTEXT: ${{ github.workspace }}/repos/conversation-service
      MCP_GATEWAY_CONTEXT: ${{ github.workspace }}/repos/mcp-gateway
      CALENDAR_MCP_CONTEXT: ${{ github.workspace }}/repos/calendar-mcp
      TELEGRAM_ADAPTER_CONTEXT: ${{ github.workspace }}/repos/telegram-adapter
      TEST_LAB_PATH: ${{ github.workspace }}/repos/test-lab
    steps:
      - name: Получить deploy
        uses: actions/checkout@v7

      - name: Прочитать версии приложений
        id: versions
        shell: pwsh
        run: |
          $versions = Get-Content -Raw config/versions.env | ConvertFrom-StringData
          "channel=$($versions.CHANNEL_GATEWAY_IMAGE.Split(':')[-1])" >> $env:GITHUB_OUTPUT
          "agent=$($versions.AGENT_RUNTIME_IMAGE.Split(':')[-1])" >> $env:GITHUB_OUTPUT
          "action=$($versions.ACTION_SERVICE_IMAGE.Split(':')[-1])" >> $env:GITHUB_OUTPUT
          "conversation=$($versions.CONVERSATION_SERVICE_IMAGE.Split(':')[-1])" >> $env:GITHUB_OUTPUT
          "gateway=$($versions.MCP_GATEWAY_IMAGE.Split(':')[-1])" >> $env:GITHUB_OUTPUT
          "calendar=$($versions.CALENDAR_MCP_IMAGE.Split(':')[-1])" >> $env:GITHUB_OUTPUT
          "telegram=$($versions.TELEGRAM_ADAPTER_IMAGE.Split(':')[-1])" >> $env:GITHUB_OUTPUT
          "test_lab=$($versions.TEST_LAB_REF)" >> $env:GITHUB_OUTPUT

      - name: Получить Channel Gateway
        uses: actions/checkout@v7
        with:
          repository: portable-agent/channel-gateway
          ref: ${{ steps.versions.outputs.channel }}
          path: repos/channel-gateway

      - name: Получить Agent Runtime
        uses: actions/checkout@v7
        with:
          repository: portable-agent/agent-runtime
          ref: ${{ steps.versions.outputs.agent }}
          path: repos/agent-runtime

      - name: Получить Action Service
        uses: actions/checkout@v7
        with:
          repository: portable-agent/action-service
          ref: ${{ steps.versions.outputs.action }}
          path: repos/action-service

      - name: Получить Conversation Service
        uses: actions/checkout@v7
        with:
          repository: portable-agent/conversation-service
          ref: ${{ steps.versions.outputs.conversation }}
          path: repos/conversation-service

      - name: Получить MCP Gateway
        uses: actions/checkout@v7
        with:
          repository: portable-agent/mcp-gateway
          ref: ${{ steps.versions.outputs.gateway }}
          path: repos/mcp-gateway

      - name: Получить Calendar MCP
        uses: actions/checkout@v7
        with:
          repository: portable-agent/calendar-mcp
          ref: ${{ steps.versions.outputs.calendar }}
          path: repos/calendar-mcp

      - name: Получить Telegram Adapter
        uses: actions/checkout@v7
        with:
          repository: portable-agent/telegram-adapter
          ref: ${{ steps.versions.outputs.telegram }}
          path: repos/telegram-adapter

      - name: Получить Test Lab
        uses: actions/checkout@v7
        with:
          repository: portable-agent/test-lab
          ref: ${{ steps.versions.outputs.test_lab }}
          path: repos/test-lab

      - uses: go-task/setup-task@v2
        with:
          version: 3.53.1

      - name: Запустить полный срез
        shell: pwsh
        run: ./scripts/start-local.ps1 -Apps

      - name: Проверить путь от текста до события
        shell: pwsh
        run: ./scripts/run-test-lab.ps1

      - name: Удалить только тестовый Compose project
        if: always()
        shell: pwsh
        run: ./scripts/stop-local.ps1 -DeleteData
